name: Build VPrime X chat APK

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.VPRIME_KEYSTORE_B64 }}" | base64 -d > app/signature/vprime-release.jks

      - name: Build FDroid Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/signature/vprime-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.VPRIME_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VPRIME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VPRIME_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFDroidRelease -x lintFDroidRelease -x lintRelease --stacktrace --no-configuration-cache

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/fdroid/release -name "*.apk" | grep -v unsigned | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk -name "*.apk" | grep -v unsigned | grep -v androidTest | head -1)
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vprime-x-chat-release
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VPrime X chat v1.0.${{ github.run_number }}"
          files: ${{ steps.apk.outputs.path }}
          prerelease: false
